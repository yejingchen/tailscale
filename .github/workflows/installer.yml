name: test installer.sh

on:
  push:
    branches:
      - "main"
    paths:
      - scripts/installer.sh
      - .github/workflows/installer.yml
  pull_request:
    branches:
      - "*"
    paths:
      - scripts/installer.sh
      - .github/workflows/installer.yml

jobs:
  test:
    strategy:
      # Don't abort the entire matrix if one element fails.
      fail-fast: false
      # Don't start all of these at once, which could saturate Github workers.
      max-parallel: 4
      matrix:
        image:
          # This is a list of Docker images against which we test our installer.
          # If you find that some of these no longer exist, please feel free
          # to remove them from the list.
          # When adding new images, please only use official ones.
          - "debian:oldstable-slim"
          - "debian:stable-slim"
          - "debian:testing-slim"
          - "debian:sid-slim"
          - "ubuntu:20.04"
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "elementary/docker:stable"
          - "elementary/docker:unstable"
          - "parrotsec/core:lts-amd64"
          - "parrotsec/core:latest"
          - "kalilinux/kali-rolling"
          - "kalilinux/kali-dev"
          - "oraclelinux:9"
          - "oraclelinux:8"
          - "fedora:latest"
          - "rockylinux:8.7"
          - "rockylinux:9"
          - "amazonlinux:latest"
          - "opensuse/leap:latest"
          - "opensuse/tumbleweed:latest"
          - "archlinux:latest"
          - "alpine:3.21"
          - "alpine:latest"
          - "alpine:edge"
        deps:
          # Run all images installing curl as a dependency.
          - curl
        include:
          # Check a few images with wget rather than curl.
          - { image: "debian:oldstable-slim", deps: "wget" }
          - { image: "debian:sid-slim", deps: "wget" }
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
    - name: install dependencies (pacman)
      # Refresh the package databases to ensure that the tailscale package is
      # defined.
      run: pacman -Sy
      if: contains(matrix.image, 'archlinux')
    - name: install dependencies (yum)
      # tar and gzip are needed by the actions/checkout below.
      run: yum install -y --allowerasing tar gzip ${{ matrix.deps }}
      if: |
        contains(matrix.image, 'centos')
        || contains(matrix.image, 'oraclelinux')
        || contains(matrix.image, 'fedora')
        || contains(matrix.image, 'amazonlinux')
    - name: install dependencies (zypper)
      # tar and gzip are needed by the actions/checkout below.
      run: zypper --non-interactive install tar gzip ${{ matrix.deps }}
      if: contains(matrix.image, 'opensuse')
      # Parrot recently (~2025-01-11) rotated their GPG keys for package signing
      # but have not (as of 2025-01-24) updated their LTS image to include these
      # new GPG keys. This image does not come with CURL / wget / a sane way of
      # fetching the .deb file that their blog post around the key rotation points
      # to (see https://parrotsec.org/blog/2025-01-11-parrot-gpg-keys/) so instead
      # use a combination of openssl s_clients and sed to download the .deb and strip
      # the header information from the resulting file so that it is a a valid .deb
      # that we can install.
    - name: install new GPG key (parrotsec/core:lts-amd64)
      run: |
        printf "GET /parrot/pool/main/p/parrot-archive-keyring/parrot-archive-keyring_2024.12_all.deb HTTP/1.1\r\nHost: www.deb.parrot.sh\r\nConnection: close\r\n\r\n" | openssl s_client -connect www.deb.parrot.sh:443 -quiet | sed  '/<arch>/,$!d' > parrot-archive-keyring_2024.12_all.deb 
        SHA_VAL=$(sha256sum parrot-archive-keyring_2024.12_all.deb)
        if "$SHA_VAL" != "188c74cf726fad499ec416dc6b7dcd9718800aa7178290c10ef7040aea9b5272"
        then
          echo "Unexpected SHA for deb"
          exit 1
        fi
        dpkg -i parrot-archive-keyring_2024.12_all.deb
      if: contains(matrix.image, 'parrotsec/core:lts-amd64')
    - name: install dependencies (apt-get)
      run: |
        apt-get update
        apt-get install -y ${{ matrix.deps }}
      if: |
        contains(matrix.image, 'debian')
        || contains(matrix.image, 'ubuntu')
        || contains(matrix.image, 'elementary')
        || contains(matrix.image, 'parrotsec')
        || contains(matrix.image, 'kalilinux')
    - name: checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: run installer
      run: scripts/installer.sh
      # Package installation can fail in docker because systemd is not running
      # as PID 1, so ignore errors at this step. The real check is the
      # `tailscale --version` command below.
      continue-on-error: true
    - name: check tailscale version
      run: tailscale --version
